name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Caches Gradle dependencies and wrapper; the runner image already ships
      # the Android SDK with platform android-37.0.
      - uses: gradle/actions/setup-gradle@v6

      # Mainnet is disabled by design: fail fast (before the slower Gradle build)
      # if production code references it outside the single allowed mapping file.
      - name: Check no mainnet references
        run: sh scripts/check-no-mainnet.sh

      - name: Check, test and build
        run: ./gradlew spotlessCheck lint :core:test testDebugUnitTest koverVerify assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/kover/html/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
